    <!-- hook -->
    <path d="M228 22 a9 9 0 1 1 18 0" />
    <!-- hanger body -->
    <path d="M237 24 L204 44 L270 44 Z" />
  </g>
  <!-- top rule -->
  <line x1="16" y1="52" x2="424" y2="52" stroke="#f5f1e8" stroke-width="3" />
